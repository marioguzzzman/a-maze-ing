[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator from the 42 A-Maze-ing project."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "maguzman" },
    { name = "dbali" },
]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
python_version = "3.10"
exclude = [
    '^\.venv/', '^\.amazeing_env/', '^build/', '^dist/', '^info_stuff/',
]

[[tool.mypy.overrides]]
module = "mlx"
ignore_missing_imports = true
