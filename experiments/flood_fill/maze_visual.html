<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flood fill maze solver</title>
<style>
  body  { font-family: Arial, sans-serif; text-align: center; }
  table { border-collapse: collapse; margin: 20px auto; }
  td    { width: 50px; height: 50px; border: 1px solid gray;
          text-align: center; font-weight: bold; font-size: 18px; }
  .wall  { background: black; }
  .open  { background: white; }
  .start { background: green; color: white; }
  .end   { background: red; color: white; }
  .flood { background: lightblue; }
  .path  { background: yellow; }
</style>
</head>
<body>
<h2>Flood fill maze solver</h2>
<table>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td></tr>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="start" data-d="0" data-path="0">S</td><td class="open" data-d="1" data-path="1"></td><td class="open" data-d="2" data-path="1"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="18" data-path="0"></td><td class="open" data-d="19" data-path="0"></td><td class="open" data-d="20" data-path="0"></td><td class="open" data-d="21" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td></tr>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="3" data-path="1"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="17" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="22" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td></tr>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="6" data-path="1"></td><td class="open" data-d="5" data-path="1"></td><td class="open" data-d="4" data-path="1"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="16" data-path="0"></td><td class="open" data-d="15" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="21" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td></tr>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="7" data-path="1"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="14" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="20" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td></tr>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="8" data-path="1"></td><td class="open" data-d="9" data-path="0"></td><td class="open" data-d="10" data-path="0"></td><td class="open" data-d="11" data-path="0"></td><td class="open" data-d="12" data-path="0"></td><td class="open" data-d="13" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="19" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td></tr>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="9" data-path="1"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="18" data-path="0"></td><td class="wall" data-d="-1" data-path="0"></td></tr>
<tr><td class="wall" data-d="-1" data-path="0"></td><td class="open" data-d="10" data-path="1"></td><td class="open" data-d="11" data-path="1"></td><td class="open" data-d="12" data-path="1"></td><td class="open" data-d="13" data-path="1"></td><td class="open" data-d="14" data-path="1"></td><td class="open" data-d="15" data-path="1"></td><td class="open" data-d="16" data-path="1"></td><td class="end" data-d="17" data-path="0">E</td><td class="wall" data-d="-1" data-path="0"></td></tr>
</table>
<button onclick="location.reload()">Replay</button>

<script>
var level = 0;
var maxLevel = 22;
var cells = document.querySelectorAll("td");

// Color all the cells that are one step further than the last time.
function nextStep() {
  level = level + 1;
  for (var i = 0; i < cells.length; i++) {
    var cell = cells[i];
    if (cell.className == "open" && cell.dataset.d == level) {
      cell.className = "flood";
      cell.textContent = level;
    }
  }
  if (level < maxLevel) {
    setTimeout(nextStep, 250);
  } else {
    setTimeout(showPath, 500);
  }
}

// Color the shortest path.
function showPath() {
  for (var i = 0; i < cells.length; i++) {
    var cell = cells[i];
    if (cell.dataset.path == "1") {
      cell.className = "path";
      cell.textContent = cell.dataset.d;
    }
  }
}

setTimeout(nextStep, 500);
</script>
</body>
</html>
